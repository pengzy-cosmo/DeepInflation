[project]
name = "deepinflation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.0.0",
    "lancedb>=0.25.3",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "openai>=2.11.0",
    "pysr>=0.16.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.10.0",
    "tantivy>=0.25.1",
    "tiktoken>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E731", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
